<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — QuoteCure</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.login-brand {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.login-brand span { color: #3b82f6; }
.login-subtitle { font-size: 13px; color: #64748b; margin-bottom: 32px; }
.form-label { display:block; font-size:11px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#64748b; margin-bottom:6px; }
.form-control {
  width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px;
  padding:10px 14px; font-family:'DM Sans',sans-serif; font-size:14px; color:#e2e8f0;
  margin-bottom:16px; transition:border-color 0.15s;
}
.form-control:focus { outline:none; border-color:#3b82f6; }
.btn-login {
  width:100%; background:#1d4ed8; color:white; border:none; border-radius:8px;
  padding:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600;
  cursor:pointer; transition:background 0.15s; margin-top:8px;
}
.btn-login:hover { background:#1e40af; }
.error { background:#7f1d1d44; border:1px solid #7f1d1d; border-radius:8px; padding:10px 14px; font-size:13px; color:#f87171; margin-bottom:16px; }
.back-link { display:block; text-align:center; margin-top:20px; font-size:13px; color:#64748b; text-decoration:none; }
.back-link:hover { color:#94a3b8; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">Quote<span>Cure</span></div>
  <div class="login-subtitle">Set a new password</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if token %}
  <form method="POST">
    <label class="form-label">New Password</label>
    <input class="form-control" name="new_password" type="password" required minlength="8" placeholder="••••••••" autofocus>
    <label class="form-label">Confirm Password</label>
    <input class="form-control" name="confirm_password" type="password" required minlength="8" placeholder="••••••••">
    <button class="btn-login" type="submit">Set Password →</button>
  </form>
  {% else %}
  <a class="back-link" href="/login">← Back to login</a>
  {% endif %}
</div>
</body>
</html>
